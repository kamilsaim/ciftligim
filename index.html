<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap');
:root{--green:#1D9E75;--green-dark:#0F6E56;--green-light:#E1F5EE;--red:#E24B4A;--red-light:#FBEAEA;--amber:#EF9F27;--amber-light:#FAEEDA;--blue:#378ADD;--blue-light:#E6F1FB;--pink:#C2466B;--pink-light:#FBEAF0;--bg-primary:#FFFFFF;--bg-secondary:#F4F6F3;--bg-tertiary:#ECF0EB;--text-primary:#1A2318;--text-secondary:#5A6B58;--border:rgba(26,35,24,.1);--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 .5px rgba(0,0,0,.06)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg-tertiary);color:var(--text-primary);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.app-shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg-tertiary)}
.app-header{background:var(--bg-primary);border-bottom:.5px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.app-title{font-family:'DM Serif Display',Georgia,serif;font-size:18px;color:var(--text-primary);letter-spacing:-.3px}
.app-sub{font-size:11px;color:var(--text-secondary);margin-top:1px}
.app-main{flex:1;overflow-y:auto;padding-bottom:72px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg-primary);border-top:.5px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;background:none;border:none;border-top:2px solid transparent;color:var(--text-secondary);transition:all .15s}
.nav-item.active{color:var(--green);border-top-color:var(--green)}
.nav-icon{font-size:20px;position:relative;display:inline-block}
.nav-label{font-size:10px;font-weight:500}
.nav-badge{position:absolute;top:-4px;right:-6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.page-content{display:flex;flex-direction:column;gap:12px;padding:14px 12px}
.card{background:var(--bg-primary);border-radius:var(--radius-lg);border:.5px solid var(--border);padding:16px;box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:var(--bg-primary);border:.5px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow)}
.stat-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.stat-value{font-size:24px;font-weight:600;color:var(--text-primary);line-height:1.2}
.stat-value.green{color:var(--green)}.stat-value.red{color:var(--red)}
.stat-sub{font-size:11px;color:var(--text-secondary);margin-top:3px}
.section-title{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.list-row.clickable{cursor:pointer}
.animal-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.row-title{font-size:15px;font-weight:500;color:var(--text-primary)}
.row-sub{font-size:13px;color:var(--text-secondary);margin-top:2px}
.empty-text{font-size:13px;color:var(--text-secondary);text-align:center;padding:16px 0}

.btn-primary{background:var(--green);color:#fff;border:none;border-radius:var(--radius-md);padding:12px 20px;font-size:15px;font-weight:500;transition:background .15s}
.btn-primary:hover{background:var(--green-dark)}

.btn-outline{background:none;color:var(--text-primary);border:.5px solid var(--border);border-radius:var(--radius-md);padding:12px 20px;font-size:15px;transition:background .15s}
.btn-outline:hover{background:var(--bg-secondary)}
.btn-outline.btn-sm{padding:9px 16px;font-size:14px;border-radius:var(--radius-sm)}
.btn-danger{background:var(--red);color:#fff;border:none;border-radius:var(--radius-md);padding:12px 20px;font-size:15px;font-weight:500}
.btn-danger.btn-sm{padding:9px 16px;font-size:14px;border-radius:var(--radius-sm)}

input,select,textarea{width:100%;padding:11px 14px;border:.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--bg-primary);color:var(--text-primary);transition:border-color .15s;appearance:auto}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.12)}

.modal-body{padding:16px}

::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@supports(padding-top:env(safe-area-inset-top)){.app-header{padding-top:calc(12px + env(safe-area-inset-top))}}

<body>
<div id="root"></div>

<script type="module">
import { initializeApp }     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged }
                              from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, writeBatch, serverTimestamp, Timestamp }
                              from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ── DATA ── */
const BREEDS = {
  koyun:    ["Akkaraman","Morkaraman","İvesi","Merinos","Karayaka","Dağlıç","Kıvırcık","Sakız","Kangal Akkaraman","Hemşin","Çine Çaparı","Norduz","Tuj","Zom","Herik","Türk Merinosu","Ramlıç","Hampshire","Suffolk","Dorset"],
  keci:     ["Kıl Keçisi","Tiftik Keçisi (Ankara)","Saanen","Malta","Alpin","Boer","Honamlı","Abaza","Halep","Nubyan","Toggenburg","Türk Saaneni","Şami"],
  buyukbas: ["Yerli Kara","Doğu Anadolu Kırmızısı","Boz Irk","Güney Anadolu Kırmızısı","Zavot","Simental","Holstein (Siyah Alaca)","Montofon","Esmer (Brown Swiss)","Hereford","Angus","Limuzin","Charolais","Jersey","Fleckvieh","Shorthorn"]
};
const TUR_LABELS = {koyun:"Koyun",keci:"Keçi",buyukbas:"Büyükbaş"};
const TUR_EMOJI  = {koyun:"🐑",keci:"🐐",buyukbas:"🐄"};
const TUR_BG     = {koyun:"#E1F5EE",keci:"#FAEEDA",buyukbas:"#E6F1FB"};
const GIDER_CATS = ["Yem","Veteriner","İlaç / Aşı","Bakım & Temizlik","Elektrik & Su","İşçilik","Ekipman","Diğer Gider"];
const GELIR_CATS = ["Hayvan Satışı","Toplu Hayvan Satışı","Süt Satışı","Et Satışı","Yün / Tiftik","Gübre","Diğer Gelir"];
const PAGES      = [["dashboard","📊","Özet"],["animals","🐑","Hayvanlar"],["barns","🏠","Ahırlar"],["finance","💰","Finans"],["reminders","🔔","Uyarılar"],["info","ℹ️","Bilgi"]];

/* ── HELPERS ── */
const fmt     = n  => Number(n||0).toLocaleString("tr-TR") + " ₺";
const fmtDate = d  => { if (!d) return "-"; const p = d.split("-"); return p[2]+"."+p[1]+"."+p[0]; };
// Tarihler yerel saatle hesaplanır (toISOString UTC verir; Türkiye'de 00:00-03:00 arası bir önceki güne düşerdi).
const pad2    = n  => String(n).padStart(2,"0");
const today   = () => { const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); };
const thisMonth = () => today().slice(0,7);
const parseDay= d  => { const [y,m,g]=d.split("-").map(Number); return new Date(y,m-1,g); };
const daysUnt = d  => { if (!d) return 999; return Math.round((parseDay(d) - parseDay(today())) / 86400000); };
const calcAge = d  => { if (!d) return "-"; const y=(new Date()-parseDay(d))/31536000000; return y<1 ? Math.floor(y*12)+" ay" : Math.floor(y)+" yıl"; };
const ageM    = d  => { if (!d) return 0; return (new Date()-parseDay(d))/(30.5*86400000); };
const lower   = s  => String(s||"").toLocaleLowerCase("tr");
const el      = id => document.getElementById(id);
const mk      = (tag,attrs,text) => { const e=document.createElement(tag); Object.assign(e,attrs); if(text!==undefined) e.textContent=text; return e; };
const isActive= a  => !a.durum || a.durum==="aktif";
const active  = () => S.animals.filter(isActive);
const DURUM_LABELS = {aktif:"Aktif",satildi:"Satıldı",oldu:"Öldü"};

function toast(msg, isError) {
  document.getElementById("app-toast")?.remove();
  const t = mk("div",{id:"app-toast",style:"position:fixed;left:50%;bottom:84px;transform:translateX(-50%);max-width:440px;width:calc(100% - 32px);background:"+(isError?"#9B1C1C":"#0a2e1f")+";color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:10000;box-shadow:0 4px 20px rgba(0,0,0,.3);text-align:center"},msg);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), isError?6000:3000);
}
// Yazma işlemleri beklenmeden başlatılır: Firestore önce yerel önbelleğe yazar, internet gelince sunucuya gönderir.
// (addDoc/commit promise'i sunucu onayına kadar beklediği için await etmek, çevrimdışıyken ekranı kilitlerdi.)
const onFail  = e  => { console.error(e); toast("Kaydedilemedi: "+(e.code||e.message), true); };

/* ── STATE ── */
const S = {
  user: undefined, page: "dashboard",
  animals: [], barns: [], finances: [],
  filterTur: "hepsi", filterCinsiyet: "hepsi", filterDurum: "aktif", animalSearch: "",
  finTab: "gider", finMonth: thisMonth(),
  modal: null, modalData: null, form: {},
};

/* ── FIREBASE ── */
const app      = initializeApp(FIREBASE_CONFIG);
const auth     = getAuth(app);
const provider = new GoogleAuthProvider();
// Çevrimdışı önbellek: veriler cihazda da tutulur, internet yokken de görüntülenir/eklenir.
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { console.warn("Çevrimdışı önbellek açılamadı:", e); db = initializeFirestore(app, {}); }
let   unsubs   = [];

const uid    = () => S.user && S.user.uid;
const colRef = col        => collection(db,"users",uid(),col);
const newRef = col        => doc(colRef(col));
const dbAdd  = (col,d)    => addDoc(colRef(col),{...d,createdAt:serverTimestamp()}).catch(onFail);
const dbUpd  = (col,id,d) => updateDoc(doc(db,"users",uid(),col,id),d).catch(onFail);
const dbDel  = (col,id)   => deleteDoc(doc(db,"users",uid(),col,id)).catch(onFail);

// Çok sayıda yazmayı tek seferde (500'lük sınırın altında parçalara bölerek) gönderir.
function commitOps(ops) {
  const chunks = [];
  for (let i=0;i<ops.length;i+=450) chunks.push(ops.slice(i,i+450));
  return Promise.all(chunks.map(ch => { const b=writeBatch(db); ch.forEach(fn=>fn(b)); return b.commit(); }));
}

function subData() {
  unsubs.forEach(u=>u()); unsubs=[];
  ["animals","barns","finances"].forEach(col => {
    const q = query(colRef(col), orderBy("createdAt","desc"));
    unsubs.push(onSnapshot(q, snap => {
      S[col] = snap.docs.map(d=>({id:d.id,...d.data()}));
      render();
    }, err => {
      console.error(col, err);
      toast("Veriler yüklenemedi ("+(err.code||err.message)+"). Lütfen çıkış yapıp tekrar girin.", true);
    }));
  });
}

getRedirectResult(auth).catch(()=>{});
render(); // giriş durumu belli olana kadar yükleniyor ekranı

onAuthStateChanged(auth, u => {
  const isFirstLogin = !S.user && u && !localStorage.getItem("ciftlik_user_seen_"+u.uid);
  S.user = u || null;
  if (u) {
    subData();
    if (isFirstLogin) {
      localStorage.setItem("ciftlik_user_seen_"+u.uid, "1");
      setTimeout(() => showWelcomeBanner(u), 1800);
    }
    // PWA install check — ilk giriş sonrası göster
    setTimeout(checkFirstVisit, 2500);
  } else {
    unsubs.forEach(f=>f()); S.animals=[]; S.barns=[]; S.finances=[];
  }
  render();
});

function showWelcomeBanner(u) {
  if (isStandalone()) return;
  const overlay = document.createElement("div");
  overlay.id = "welcome-banner";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px);animation:fadeIn .2s ease;font-family:sans-serif";

  const box = document.createElement("div");
  box.style.cssText = "background:#fff;border-radius:20px;padding:28px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3)";

  const logoEl = document.createElement("div");
  logoEl.style.cssText = "width:72px;height:72px;border-radius:20px;background:#0a2e1f;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 16px";
  const welImg = document.createElement("img");
  welImg.src = window.LOGO_B64;
  welImg.style.cssText = "width:72px;height:72px;border-radius:16px;object-fit:contain;background:#0a2e1f;padding:4px";
  logoEl.appendChild(welImg);

  const h1El = document.createElement("div");
  h1El.style.cssText = "font-family:'Georgia',serif;font-size:22px;color:#1A2318;margin-bottom:6px";
  h1El.textContent = "Hoş Geldiniz!";

  const nameEl = document.createElement("div");
  nameEl.style.cssText = "font-size:13px;color:#5A6B58;margin-bottom:4px";
  nameEl.textContent = u.displayName || u.email || "";

  const descEl = document.createElement("div");
  descEl.style.cssText = "font-size:13px;color:#5A6B58;margin-bottom:20px";
  descEl.textContent = "Çiftliğim'e ilk kez giriş yaptınız. Hayvanlarınızı, ahırlarınızı ve finansal kayıtlarınızı kolayca takip edebilirsiniz.";

  const tipBox = document.createElement("div");
  tipBox.style.cssText = "background:#E1F5EE;border-radius:12px;padding:12px;margin-bottom:16px;text-align:left";
  const tipTitle = document.createElement("div");
  tipTitle.style.cssText = "font-size:12px;font-weight:600;color:#0F6E56;margin-bottom:6px";
  tipTitle.textContent = "HIZLI BAŞLANGIÇ";
  const tipBody = document.createElement("div");
  tipBody.style.cssText = "font-size:12px;color:#1A2318;line-height:1.8";
  tipBody.innerHTML = "🏠 Önce <b>Ahır Ekle</b><br>🐑 Sonra <b>Hayvan Ekle</b><br>💰 Yem/gider için <b>Finans</b> sekmesi";
  tipBox.append(tipTitle, tipBody);

  const startBtn = document.createElement("button");
  startBtn.style.cssText = "width:100%;background:#1D9E75;color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer";
  startBtn.textContent = "Başlayalım! 🐑";
  startBtn.addEventListener("click", () => overlay.remove());

  box.append(logoEl, h1El, nameEl, descEl, tipBox, startBtn);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

/* ══════════════════════════════════════
   RENDER
══════════════════════════════════════ */
function render() {
  const root = el("root");
  if (!root) return;
  if (S.user === undefined) { root.innerHTML = ""; root.appendChild(loadingEl()); return; }
  if (!S.user) { root.innerHTML = ""; root.appendChild(loginEl()); return; }

  // Sayfa her render'da baştan çizildiği için: odaktaki alanı ve açık penceredeki yazılmış
  // değerleri saklayıp geri koyuyoruz. Aksi halde arama kutusu her harfte klavyeyi kapatır,
  // Firestore'dan gelen bir güncelleme ya da bir seçim değişikliği formdaki yazıları siler.
  const act = document.activeElement;
  const focusId = act && act.id && root.contains(act) ? act.id : null;
  let selStart = null, selEnd = null;
  try { if (focusId) { selStart = act.selectionStart; selEnd = act.selectionEnd; } } catch(e) {}
  const saved = {};
  const modalKey = S.modal ? S.modal+":"+(S.modalData?.id||"") : "";
  if (modalKey && root.dataset.modalKey===modalKey) root.querySelectorAll(".modal [id]").forEach(f => {
    if (f.tagName==="INPUT" && f.type==="file") return;
    if (f.tagName==="INPUT" && f.type==="checkbox") saved[f.id] = {checked:f.checked};
    else if (["INPUT","SELECT","TEXTAREA"].includes(f.tagName)) saved[f.id] = {value:f.value};
  });
  const modalScroll = root.querySelector(".modal")?.scrollTop || 0;

  root.innerHTML = "";
  root.appendChild(appEl());
  root.dataset.modalKey = modalKey;

  Object.entries(saved).forEach(([id,v]) => {
    const f = el(id); if (!f || !root.querySelector(".modal")?.contains(f)) return;
    if ("checked" in v) { if (f.checked!==v.checked) { f.checked=v.checked; f.dispatchEvent(new Event("change")); } }
    else if (f.tagName==="SELECT") { if ([...f.options].some(o=>o.value===v.value)) f.value=v.value; }
    else f.value = v.value;
  });
  const m = root.querySelector(".modal"); if (m) m.scrollTop = modalScroll;
  if (focusId) {
    const f = el(focusId);
    if (f) { f.focus(); try { if (selStart!==null) f.setSelectionRange(selStart, selEnd); } catch(e) {} }
  }
}

/* ── LOADING ── */
function loadingEl() {
  const d = mk("div",{style:"min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a2e1f;gap:16px"});
  const li=document.createElement("img");li.src=window.LOGO_B64;li.style.cssText="width:64px;height:64px;border-radius:14px;object-fit:cover";d.append(li,mk("div",{style:"color:rgba(232,245,224,.6);font-size:14px;margin-top:8px"},"Yükleniyor..."));
  return d;
}

/* ── LOGIN ── */
function loginEl() {
  const wrap = mk("div",{style:"min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#0a2e1f,#0d3d28 50%,#0a2e1f);padding:24px"});
  const inner = mk("div",{style:"text-align:center;max-width:360px;width:100%"});
const logo = document.createElement("div");logo.style.cssText="width:110px;height:110px;border-radius:20px;overflow:hidden;margin:0 auto 16px;background:#0a2e1f;box-shadow:0 4px 20px rgba(0,0,0,.4)";const _li=document.createElement("img");_li.src=window.LOGO_B64;_li.style.cssText="width:100%;height:100%;object-fit:cover";logo.appendChild(_li);
  const h1   = mk("h1",{style:"color:#e8f5e0;font-size:36px;font-weight:400;margin:0 0 6px;font-family:'Georgia',serif"},"Çiftliğim");
  const sub  = mk("p",{style:"color:rgba(232,245,224,.5);font-size:14px;margin:0 0 28px"},"Küçükbaş & Büyükbaş Yönetim Sistemi");
  inner.append(logo, h1, sub);
  [["🐑","Koyun, keçi, büyükbaş takibi"],["🤰","Gebelik & doğum yönetimi"],["💰","Yem, gider ve satış kaydı"],["🔔","Otomatik hatırlatıcılar"]].forEach(([ico,txt]) => {
    const row = mk("div",{style:"display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:.5px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 16px;margin-bottom:8px;text-align:left"});
    row.append(mk("span",{style:"font-size:18px"},ico), mk("span",{style:"color:rgba(232,245,224,.8);font-size:13px"},txt));
    inner.appendChild(row);
  });
  const btn = mk("button",{style:"width:100%;padding:14px 20px;background:#fff;border:none;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:500;margin-top:20px;box-shadow:0 4px 24px rgba(0,0,0,.3)"});
  btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>';
  btn.appendChild(mk("span",{},"Google ile Giriş Yap"));
  btn.addEventListener("click", async () => {
    try { await signInWithPopup(auth, provider); }
    catch(e) {
      if (["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(e.code))
        await signInWithRedirect(auth, provider);
    }
  });
  const note = mk("p",{style:"color:rgba(232,245,224,.3);font-size:11px;margin-top:16px"},"Verileriniz güvenle Firebase'de saklanır");
  inner.append(btn, note);
  wrap.appendChild(inner);
  return wrap;
}

/* ── APP SHELL ── */
function logout() { S.modal=null; S.modalData=null; S.form={}; S.page="dashboard"; signOut(auth); }

function appEl() {
  const urgentCount = active().filter(a=>a.gebe&&a.tahminiDogum&&daysUnt(a.tahminiDogum)<=7).length
    + S.barns.filter(b=>active().filter(a=>a.ahirId===b.id).length>Math.max(b.kapasite,1)).length;

  const shell = mk("div",{className:"app-shell"});

  /* header */
  const hdr = mk("header",{className:"app-header"});
  const hdrL = mk("div",{});
  hdrL.append((()=>{const t=mk("div",{className:"app-title"});const i=document.createElement("img");i.src=window.LOGO_B64;i.style.cssText="width:28px;height:28px;border-radius:6px;object-fit:cover;margin-right:8px;vertical-align:middle";t.appendChild(i);t.appendChild(document.createTextNode("Çiftliğim"));return t;})(), mk("div",{className:"app-sub"}, active().length+" hayvan · "+S.barns.length+" ahır"));
  const logoutBtn = mk("button",{style:"background:none;border:.5px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text-secondary);cursor:pointer"},"Çıkış");
  logoutBtn.addEventListener("click", logout);
  hdr.append(hdrL, logoutBtn);

  /* main */
  const main = mk("main",{className:"app-main"});
  if (S.page==="dashboard") main.appendChild(dashboardEl());
  if (S.page==="animals")   main.appendChild(animalsEl());
  if (S.page==="barns")     main.appendChild(barnsEl());
  if (S.page==="finance")   main.appendChild(financeEl());
  if (S.page==="reminders") main.appendChild(remindersEl());
  if (S.page==="info")      main.appendChild(infoEl());

  /* bottom nav */
  const nav = mk("nav",{className:"bottom-nav"});
  PAGES.forEach(([id,ico,lbl]) => {
    const btn = mk("button",{className:"nav-item"+(S.page===id?" active":"")});
    const iconSpan = mk("span",{className:"nav-icon"},ico);
    if (id==="reminders" && urgentCount>0) {
      const badge = mk("span",{className:"nav-badge"},String(urgentCount));
      iconSpan.appendChild(badge);
    }
    btn.append(iconSpan, mk("span",{className:"nav-label"},lbl));
    btn.addEventListener("click", ()=>{ S.page=id; render(); });
    nav.appendChild(btn);
  });

  shell.append(hdr, main, nav);

  /* modal */
  const mEl = buildModal();
  if (mEl) shell.appendChild(mEl);

  return shell;
}

/* ══════════════════════════════════════
   DASHBOARD
══════════════════════════════════════ */
function dashboardEl() {
  const tm   = thisMonth();
  const koyun= active().filter(a=>a.tur==="koyun").length;
  const keci = active().filter(a=>a.tur==="keci").length;
  const buyuk= active().filter(a=>a.tur==="buyukbas").length;
  const gebe = active().filter(a=>a.gebe).length;
  const gelir= S.finances.filter(f=>f.tip==="gelir"&&(f.tarih||"").startsWith(tm)).reduce((s,f)=>s+(f.tutar||0),0);
  const gider= S.finances.filter(f=>f.tip==="gider"&&(f.tarih||"").startsWith(tm)).reduce((s,f)=>s+(f.tutar||0),0);
  const maxT = Math.max(koyun,keci,buyuk,1);

  const wrap = mk("div",{className:"page-content"});

  /* stats */
  const grid = mk("div",{className:"stat-grid"});
  [
    ["Toplam Hayvan", active().length, koyun+"🐑 "+keci+"🐐 "+buyuk+"🐄", ""],
    ["Gebe Hayvan", gebe, "Takipte", "color:var(--pink)"],
    ["Bu Ay Gelir", fmt(gelir), "", "color:var(--green)"],
    ["Bu Ay Gider", fmt(gider), "", "color:var(--red)"],
  ].forEach(([label,val,sub,style]) => {
    const c = mk("div",{className:"stat-card"});
    const v = mk("div",{className:"stat-value"}, String(val));
    if(style) v.style.cssText=style+";font-size:18px";
    c.append(mk("div",{className:"stat-label"},label), v);
    if(sub) c.append(mk("div",{className:"stat-sub"},sub));
    grid.appendChild(c);
  });
  wrap.appendChild(grid);

  /* tur chart */
  const chartCard = mk("div",{className:"card"});
  chartCard.appendChild(mk("div",{className:"section-title"},"Tür Dağılımı"));
  [["Koyun 🐑",koyun,"#1D9E75"],["Keçi 🐐",keci,"#EF9F27"],["Büyükbaş 🐄",buyuk,"#378ADD"]].forEach(([lbl,cnt,clr])=>{
    const row = mk("div",{style:"display:flex;align-items:center;gap:10px;margin-bottom:10px"});
    const labelEl = mk("div",{style:"width:76px;font-size:12px;color:var(--text-secondary);text-align:right"},lbl);
    const barWrap = mk("div",{style:"flex:1;height:22px;background:var(--bg-secondary);border-radius:4px;overflow:hidden"});
    const bar = mk("div",{style:"height:100%;width:"+Math.round(cnt/maxT*100)+"%;background:"+clr+";border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:11px;color:#fff;font-weight:500;min-width:"+(cnt?24:0)+"px"},cnt?String(cnt):"");
    barWrap.appendChild(bar);
    row.append(labelEl,barWrap);
    chartCard.appendChild(row);
  });
  wrap.appendChild(chartCard);

  /* yaklaşan doğumlar */
  const yakCard = mk("div",{className:"card"});
  yakCard.appendChild(mk("div",{className:"section-title"},"Yaklaşan Doğumlar"));
  const yaklaşan = active().filter(a=>a.gebe&&a.tahminiDogum).map(a=>({...a,gun:daysUnt(a.tahminiDogum)})).filter(a=>a.gun<=60).sort((a,b)=>a.gun-b.gun).slice(0,5);
  if (!yaklaşan.length) { yakCard.appendChild(mk("p",{className:"empty-text"},"Yaklaşan doğum yok")); }
  else yaklaşan.forEach(a => {
    const row = mk("div",{className:"list-row"});
    const av  = mk("div",{className:"animal-avatar",style:"background:"+TUR_BG[a.tur]},TUR_EMOJI[a.tur]);
    const inf = mk("div",{style:"flex:1"});
    inf.append(mk("div",{className:"row-title"},a.kupe+(a.isim?" · "+a.isim:"")), mk("div",{className:"row-sub"},fmtDate(a.tahminiDogum)+" · "+(a.gun>0?a.gun+" gün":a.gun===0?"Bugün":(-a.gun)+" gün geçti")));
    const badge = mk("span",{className:"badge "+(a.gun<=7?"badge-danger":a.gun<=14?"badge-warning":"badge-success")},a.gun<=7?"Çok Yakın":a.gun<=14?"Yakın":"Takipte");
    row.append(av,inf,badge);
    yakCard.appendChild(row);
  });
  wrap.appendChild(yakCard);

  /* son işlemler */
  const finCard = mk("div",{className:"card"});
  finCard.appendChild(mk("div",{className:"section-title"},"Son Finansal İşlemler"));
  const sonIslemler = [...S.finances].sort((a,b)=>(b.tarih||"").localeCompare(a.tarih||"")).slice(0,5);
  if (!sonIslemler.length) { finCard.appendChild(mk("p",{className:"empty-text"},"Henüz işlem yok")); }
  else sonIslemler.forEach(f => {
    const row = mk("div",{className:"list-row"});
    const inf = mk("div",{style:"flex:1"});
    const title = mk("div",{className:"row-title"},f.kategori+(f.aciklama?" · "+f.aciklama:""));
    inf.append(title, mk("div",{className:"row-sub"},fmtDate(f.tarih)));
    const amt = mk("div",{style:"font-weight:500;font-size:14px;color:"+(f.tip==="gelir"?"var(--green)":"var(--red)")},(f.tip==="gelir"?"+":"−")+fmt(f.tutar));
    row.append(inf,amt);
    finCard.appendChild(row);
  });
  wrap.appendChild(finCard);
  return wrap;
}

/* ══════════════════════════════════════
   ANIMALS
══════════════════════════════════════ */
function animalsEl() {
  const wrap = mk("div",{className:"page-content"});

  /* filter card */
  const fc = mk("div",{className:"card",style:"padding:12px 14px"});
  const srch = mk("input",{id:"animal-search",className:"search-input",placeholder:"🔍  Küpe no, isim veya ırk ara...",value:S.animalSearch,style:"width:100%;margin-bottom:10px"});
  // Yazarken tüm sayfayı değil yalnızca sayaç ve listeyi yeniliyoruz; böylece klavye/odak bozulmaz.
  srch.addEventListener("input", e=>{
    S.animalSearch=e.target.value;
    const fresh=animalsEl();
    ["animal-toolbar","animal-list"].forEach(id=>{ const n=fresh.querySelector("#"+id); el(id)?.replaceWith(n); });
  });
  fc.appendChild(srch);

  const chipWrap = mk("div",{style:"display:flex;gap:6px;flex-wrap:wrap"});
  ["hepsi","koyun","keci","buyukbas"].forEach(t=>{
    const c = mk("button",{className:"filter-chip"+(S.filterTur===t?" active":"")},t==="hepsi"?"Hepsi":TUR_EMOJI[t]+" "+TUR_LABELS[t]);
    c.addEventListener("click",()=>{ S.filterTur=t; render(); });
    chipWrap.appendChild(c);
  });
  chipWrap.appendChild(mk("div",{style:"width:100%;height:1px;background:var(--border);margin:4px 0"}));
  ["hepsi","disi","erkek"].forEach(c2=>{
    const c = mk("button",{className:"filter-chip"+(S.filterCinsiyet===c2?" active":"")},c2==="hepsi"?"Tüm Cinsiyetler":c2==="disi"?"♀ Dişi":"♂ Erkek");
    c.addEventListener("click",()=>{ S.filterCinsiyet=c2; render(); });
    chipWrap.appendChild(c);
  });
  chipWrap.appendChild(mk("div",{style:"width:100%;height:1px;background:var(--border);margin:4px 0"}));
  ["aktif","satildi","oldu"].forEach(d=>{
    const n = S.animals.filter(a=>(a.durum||"aktif")===d).length;
    const c = mk("button",{className:"filter-chip"+(S.filterDurum===d?" active":"")},DURUM_LABELS[d]+" ("+n+")");
    c.addEventListener("click",()=>{ S.filterDurum=d; render(); });
    chipWrap.appendChild(c);
  });
  fc.appendChild(chipWrap);
  wrap.appendChild(fc);

  /* toolbar */
  const tb = mk("div",{id:"animal-toolbar",style:"display:flex;justify-content:space-between;align-items:center"});
  const q = lower(S.animalSearch.trim());
  const list = S.animals.filter(a=>{
    if((a.durum||"aktif")!==S.filterDurum) return false;
    if(S.filterTur!=="hepsi"&&a.tur!==S.filterTur) return false;
    if(S.filterCinsiyet!=="hepsi"&&a.cinsiyet!==S.filterCinsiyet) return false;
    if(q&&!lower(a.kupe).includes(q)&&!lower(a.isim).includes(q)&&!lower(a.irk).includes(q)) return false;
    return true;
  });
  tb.append(mk("span",{style:"font-size:13px;color:var(--text-secondary)"},list.length+" hayvan listeleniyor"));
  const btnGroup = mk("div",{style:"display:flex;gap:8px"});
  const bulkBtn = mk("button",{className:"btn-outline btn-sm"},"+ Toplu Ekle");
  bulkBtn.addEventListener("click",()=>{ S.modal="bulkAddAnimal"; S.form={}; render(); });
  const addBtn = mk("button",{className:"btn-primary btn-sm"},"+ Hayvan Ekle");
  addBtn.addEventListener("click",()=>{ S.modal="addAnimal"; S.form={}; render(); });
  btnGroup.append(bulkBtn,addBtn);
  tb.appendChild(btnGroup);
  wrap.appendChild(tb);

  /* list */
  const listCard = mk("div",{id:"animal-list",className:"card",style:"padding:0;overflow:hidden"});
  if (!list.length) { listCard.appendChild(mk("p",{className:"empty-text",style:"padding:24px"},"Hayvan bulunamadı")); }
  else list.forEach((a,i)=>{
    const barn = S.barns.find(b=>b.id===a.ahirId);
    const row  = mk("div",{className:"list-row clickable",style:"border-top:"+(i>0?"0.5px solid var(--border)":"none")+";padding:12px 16px"});
    const av   = mk("div",{className:"animal-avatar",style:"background:"+TUR_BG[a.tur]},TUR_EMOJI[a.tur]);
    const inf  = mk("div",{style:"flex:1;min-width:0"});
    const titleLine = mk("div",{style:"display:flex;align-items:center;gap:6px;flex-wrap:wrap"});
    titleLine.appendChild(mk("span",{className:"row-title"},a.kupe));
    if(a.isim) titleLine.appendChild(mk("span",{style:"font-size:12px;color:var(--text-secondary)"},"· "+a.isim));
    if(a.gebe&&isActive(a)) titleLine.appendChild(mk("span",{className:"badge badge-pink"},"Gebe"));
    if(!isActive(a)) titleLine.appendChild(mk("span",{className:"badge badge-neutral"},DURUM_LABELS[a.durum]+(a.cikisTarihi?" · "+fmtDate(a.cikisTarihi):"")));
    const subLine = mk("div",{className:"row-sub"},(a.irk||TUR_LABELS[a.tur])+" · "+(a.cinsiyet==="disi"?"♀ Dişi":"♂ Erkek")+(a.agirlik?" · "+a.agirlik+"kg":"")+(barn?" · "+barn.ad:""));
    inf.append(titleLine,subLine);
    const arr = mk("span",{style:"color:var(--text-secondary);font-size:18px"},"›");
    row.append(av,inf,arr);
    row.addEventListener("click",()=>{ S.modal="detailAnimal"; S.modalData=a; render(); });
    listCard.appendChild(row);
  });
  wrap.appendChild(listCard);
  return wrap;
}

/* ══════════════════════════════════════
   BARNS
══════════════════════════════════════ */
function barnsEl() {
  const wrap = mk("div",{className:"page-content"});
  const tb = mk("div",{style:"display:flex;justify-content:flex-end"});
  const addBtn = mk("button",{className:"btn-primary btn-sm"},"+ Ahır Ekle");
  addBtn.addEventListener("click",()=>{ S.modal="addBarn"; S.form={}; render(); });
  tb.appendChild(addBtn);
  wrap.appendChild(tb);

  if (!S.barns.length) wrap.appendChild(mk("p",{className:"empty-text card",style:"padding:24px"},"Henüz ahır eklenmemiş"));

  S.barns.forEach(b => {
    const anims = active().filter(a=>a.ahirId===b.id);
    const pct   = Math.round(anims.length/Math.max(b.kapasite,1)*100);
    const barColor = pct>90?"#E24B4A":pct>70?"#EF9F27":"#1D9E75";
    const turCounts = {koyun:0,keci:0,buyukbas:0};
    anims.forEach(a=>turCounts[a.tur]=(turCounts[a.tur]||0)+1);

    const card = mk("div",{className:"card"});

    const topRow = mk("div",{style:"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px"});
    const titleDiv = mk("div",{});
    titleDiv.append(mk("div",{style:"font-weight:600;font-size:16px"},"🏠 "+b.ad), mk("div",{style:"font-size:12px;color:var(--text-secondary);margin-top:2px"},b.tur+" · Kapasite: "+b.kapasite));
    const editBtn = mk("button",{className:"btn-outline btn-sm"},"Düzenle");
    editBtn.addEventListener("click",()=>{ S.modal="editBarn"; S.form={...b}; render(); });
    topRow.append(titleDiv,editBtn);
    card.appendChild(topRow);

    const pctRow = mk("div",{style:"display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"});
    pctRow.append(mk("span",{style:"color:var(--text-secondary)"},"Doluluk"), mk("span",{style:"font-weight:500;color:"+barColor},anims.length+"/"+b.kapasite+" · %"+pct));
    card.appendChild(pctRow);
    const barWrap = mk("div",{style:"height:8px;background:var(--bg-secondary);border-radius:4px;overflow:hidden;margin-bottom:12px"});
    barWrap.appendChild(mk("div",{style:"height:100%;width:"+Math.min(pct,100)+"%;background:"+barColor+";border-radius:4px"}));
    card.appendChild(barWrap);

    const badges = mk("div",{style:"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:"+(b.aciklama?8:0)+"px"});
    Object.entries(turCounts).filter(([,c])=>c>0).forEach(([t,c])=> badges.appendChild(mk("span",{className:"badge badge-neutral"},TUR_EMOJI[t]+" "+c)));
    card.appendChild(badges);
    if (b.aciklama) card.appendChild(mk("div",{style:"font-size:12px;color:var(--text-secondary)"},b.aciklama));

    const delRow = mk("div",{style:"margin-top:10px;border-top:.5px solid var(--border);padding-top:10px"});
    const delBtn = mk("button",{className:"btn-danger-outline"},"Ahırı Sil");
    delBtn.addEventListener("click",()=>{ S.modal="confirmDelete"; S.modalData={msg:'"'+b.ad+'" ahırını silmek istiyor musunuz?',note:anims.length?"Bu ahırdaki "+anims.length+" hayvan ahırsız kalacak (hayvanlar silinmez).":"",col:"barns",id:b.id}; render(); });
    delRow.appendChild(delBtn);
    card.appendChild(delRow);
    wrap.appendChild(card);
  });
  return wrap;
}

/* ══════════════════════════════════════
   FINANCE
══════════════════════════════════════ */
function financeEl() {
  const tm   = thisMonth();
  const gelir= S.finances.filter(f=>f.tip==="gelir"&&(f.tarih||"").startsWith(tm)).reduce((s,f)=>s+(f.tutar||0),0);
  const gider= S.finances.filter(f=>f.tip==="gider"&&(f.tarih||"").startsWith(tm)).reduce((s,f)=>s+(f.tutar||0),0);
  const net  = gelir-gider;
  const yil  = tm.slice(0,4);
  const yG   = S.finances.filter(f=>f.tip==="gelir"&&(f.tarih||"").startsWith(yil)).reduce((s,f)=>s+(f.tutar||0),0);
  const yD   = S.finances.filter(f=>f.tip==="gider"&&(f.tarih||"").startsWith(yil)).reduce((s,f)=>s+(f.tutar||0),0);

  const wrap = mk("div",{className:"page-content"});

  /* stats */
  const grid = mk("div",{className:"stat-grid"});
  [["Bu Ay Net",fmt(Math.abs(net)),net>=0?"▲ Kâr":"▼ Zarar",net>=0?"var(--green)":"var(--red)"],
   ["Bu Yıl Net ("+yil+")",fmt(Math.abs(yG-yD)),(yG-yD)>=0?"▲ Kâr":"▼ Zarar",(yG-yD)>=0?"var(--green)":"var(--red)"],
   ["Bu Ay Gelir",fmt(gelir),"","var(--green)"],["Bu Ay Gider",fmt(gider),"","var(--red)"]
  ].forEach(([label,val,sub,clr])=>{
    const c=mk("div",{className:"stat-card"});
    const v=mk("div",{className:"stat-value",style:"font-size:18px;color:"+clr},val);
    c.append(mk("div",{className:"stat-label"},label),v);
    if(sub) c.append(mk("div",{className:"stat-sub"},sub));
    grid.appendChild(c);
  });
  wrap.appendChild(grid);

  /* tab + add */
  const tbRow = mk("div",{style:"display:flex;gap:8px;align-items:center"});
  const tabBar = mk("div",{className:"tab-bar",style:"flex:1"});
  ["gider","gelir"].forEach(t=>{
    const btn = mk("button",{className:"tab-btn"+(S.finTab===t?" active":"")},t==="gider"?"Giderler":"Gelirler");
    btn.addEventListener("click",()=>{ S.finTab=t; render(); });
    tabBar.appendChild(btn);
  });
  const addBtn = mk("button",{className:"btn-primary btn-sm"},"+ Ekle");
  addBtn.addEventListener("click",()=>{ S.modal="addFin"; S.form={tip:"gider",kategori:"Yem",tarih:today()}; render(); });
  const saleBtn = mk("button",{className:"btn-outline btn-sm",style:"white-space:nowrap"},"🐑 Toplu Satış");
  saleBtn.addEventListener("click",()=>{ S.modal="topluSatis"; S.form={tarih:today(),alici:"",tutar:"",odenen:"",hayvanlar:[]}; render(); });
  tbRow.append(tabBar,saleBtn,addBtn);
  wrap.appendChild(tbRow);

  /* month filter */
  const monthCard = mk("div",{className:"card",style:"padding:10px 14px"});
  monthCard.appendChild(mk("label",{className:"form-label"},"Ay Filtresi"));
  const monthSel = mk("select",{});
  const allOpt   = mk("option",{value:""},"Tüm Zamanlar");
  monthSel.appendChild(allOpt);
  const months = [...new Set(S.finances.map(f=>(f.tarih||"").slice(0,7)).filter(Boolean))];
  if (!months.includes(tm)) months.push(tm);
  months.sort().reverse().forEach(m=>{
    const opt = mk("option",{value:m},m);
    if(S.finMonth===m) opt.selected=true;
    monthSel.appendChild(opt);
  });
  monthSel.addEventListener("change",e=>{ S.finMonth=e.target.value; render(); });
  monthCard.appendChild(monthSel);
  wrap.appendChild(monthCard);

  /* category chart */
  const filtered = S.finances.filter(f=>f.tip===S.finTab&&(!S.finMonth||(f.tarih||"").startsWith(S.finMonth))).sort((a,b)=>(b.tarih||"").localeCompare(a.tarih||""));
  const catMap={};
  filtered.forEach(f=>catMap[f.kategori]=(catMap[f.kategori]||0)+(f.tutar||0));
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  if (cats.length) {
    const catCard = mk("div",{className:"card"});
    catCard.appendChild(mk("div",{className:"section-title"},"Kategori Dağılımı"));
    const maxCat = cats[0][1];
    cats.forEach(([cat,total])=>{
      const row = mk("div",{style:"display:flex;align-items:center;gap:8px;margin-bottom:8px"});
      row.appendChild(mk("div",{style:"width:90px;font-size:11px;color:var(--text-secondary);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},cat));
      const bw = mk("div",{style:"flex:1;height:18px;background:var(--bg-secondary);border-radius:3px;overflow:hidden"});
      bw.appendChild(mk("div",{style:"height:100%;width:"+Math.round(total/maxCat*100)+"%;background:"+(S.finTab==="gider"?"#E24B4A":"#1D9E75")+";border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-size:10px;color:#fff;font-weight:500"},fmt(total)));
      row.appendChild(bw);
      catCard.appendChild(row);
    });
    wrap.appendChild(catCard);
  }

  /* list */
  const listCard = mk("div",{className:"card",style:"padding:0"});
  if (!filtered.length) listCard.appendChild(mk("p",{className:"empty-text",style:"padding:20px"},"Bu dönemde kayıt yok"));
  else filtered.forEach((f,i)=>{
    const row = mk("div",{className:"list-row clickable",style:"border-top:"+(i>0?"0.5px solid var(--border)":"none")+";padding:12px 16px"});
    row.addEventListener("click",()=>{ S.modal="editFin"; S.modalData={id:f.id}; S.form={...f}; render(); });
    const inf = mk("div",{style:"flex:1;min-width:0"});
    inf.append(mk("div",{style:"font-weight:500;font-size:14px"},f.kategori), mk("div",{className:"row-sub"},fmtDate(f.tarih)+(f.aciklama?" · "+f.aciklama:"")));
    const right = mk("div",{style:"display:flex;align-items:center;gap:10px"});
    const amtDiv = mk("div",{style:"text-align:right"});
    amtDiv.appendChild(mk("span",{style:"display:block;font-weight:600;color:"+(f.tip==="gelir"?"var(--green)":"var(--red)")},(f.tip==="gelir"?"+":"−")+fmt(f.tutar)));
    if(f.odenen!==undefined && f.odenen!==null && f.odenen!=="") {
      const kalan = (f.tutar||0)-(f.odenen||0);
      amtDiv.appendChild(mk("span",{style:"display:block;font-size:11px;color:"+(kalan>0?"var(--red)":"var(--green)")},kalan>0?"Kalan: "+fmt(kalan):"✓ Ödendi"));
    }
    right.appendChild(amtDiv);
    const delBtn = mk("button",{className:"icon-btn",style:"color:var(--red);opacity:.6"},"✕");
    delBtn.addEventListener("click",e=>{ e.stopPropagation(); S.modal="confirmDelete"; S.modalData={msg:"Bu kaydı silmek istiyor musunuz?",col:"finances",id:f.id}; render(); });
    right.appendChild(delBtn);
    row.append(inf,right);
    listCard.appendChild(row);
  });
  wrap.appendChild(listCard);

function remindersEl() {

  const danger=list.filter(r=>r.level==="danger").length, warning=list.filter(r=>r.level==="warning").length, info=list.filter(r=>r.level==="info").length;

function downloadBackup() {
  const data = {version:"1.3.0",exportDate:new Date().toISOString(),animals:S.animals,barns:S.barns,finances:S.finances};
  const json = JSON.stringify(data,null,2);
  const filename = "ciftlikapp-yedek-"+today()+".json";
  // Android WebView sarmalayıcısı blob: indirmelerini desteklemediği için,
  // köprü mevcutsa (native uygulama) doğrudan ona devrediyoruz.
  if (window.AndroidDownloader && window.AndroidDownloader.saveBackup) {
    const b64 = btoa(unescape(encodeURIComponent(json)));
    window.AndroidDownloader.saveBackup(b64, filename);
    return;
  }
  const blob = new Blob([json],{type:"application/json"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  // Hemen iptal edilirse bazı tarayıcılarda (Safari/Firefox) indirme başlamıyor.
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
}

const toTs = v => (v && typeof v.seconds==="number") ? new Timestamp(v.seconds, v.nanoseconds||0) : serverTimestamp();
const validId = id => typeof id==="string" && id && !id.includes("/") && id!=="." && id!=="..";

async function uploadBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch(e) { alert("Dosya okunamadı: geçerli bir yedek dosyası değil."); return; }
  if (!data || !Array.isArray(data.animals) || !Array.isArray(data.barns) || !Array.isArray(data.finances)) { alert("Geçersiz yedek dosyası!"); return; }
  if (!confirm("Yedek yüklenecek:\n• "+data.animals.length+" hayvan\n• "+data.barns.length+" ahır\n• "+data.finances.length+" finansal kayıt\n\nMevcut verileriniz silinmez. Yedekteki bir kayıt zaten varsa yedekteki haliyle güncellenir, kopya oluşmaz. Devam edilsin mi?")) return;
  // Kayıtlar yedekteki kendi ID'leriyle yazılır: hem aynı yedeği tekrar yüklemek kopya üretmez,
  // hem de hayvan→ahır ve satış→hayvan bağlantıları olduğu gibi korunur.
  try {
    const ops = [];
    [["barns",data.barns],["animals",data.animals],["finances",data.finances]].forEach(([col,items])=>{
      items.forEach(item=>{
        if (!item || typeof item!=="object") return;
        const {id,createdAt,...d} = item;
        const ref = validId(id) ? doc(colRef(col), id) : newRef(col);
        ops.push(b=>b.set(ref,{...d,createdAt:toTs(createdAt)}));
      });
    });
    toast("Yedek yükleniyor...");
    commitOps(ops).then(()=>toast("✅ Yedek başarıyla yüklendi!")).catch(onFail);
  } catch(e) {
    alert("Yedek yüklenemedi: "+e.message);
  }
}

function modalHeader(title) {
  const hdr=mk("div",{className:"modal-header"});
  hdr.append(mk("span",{style:"font-weight:600"},title));
  const x=mk("button",{className:"icon-btn"},"✕"); x.addEventListener("click",closeModal);
  hdr.appendChild(x);
  return hdr;
}

function closeModal() { S.modal=null; S.modalData=null; S.form={}; render(); }

  const r2=mk("div",{className:"form-row-2"});
  const g1=mk("div",{className:"form-group"}); g1.append(mk("label",{className:"form-label"},"Tür *"));

  const tahminG=mk("div",{className:"form-group",id:"f-gebe-row",style:"display:"+(f.gebe?"block":"none")});

  const tahminInp=mk("input",{type:"date",id:"f-tahmin",value:f.tahminiDogum||""});
  tahminG.appendChild(tahminInp); wrap.appendChild(tahminG);
  gebeChk.addEventListener("change",e=>{ tahminG.style.display=e.target.checked?"block":"none"; });

  const notG=mk("div",{className:"form-group"}); notG.append(mk("label",{className:"form-label"},"Not / Sağlık Bilgisi"));
  const notTa=mk("textarea",{id:"f-not",rows:2,placeholder:"Aşı notu, özel bilgi..."}); notTa.value=f.not||""; notG.appendChild(notTa); wrap.appendChild(notG);
  return wrap;
}

  g1.appendChild(irkSel); r3.appendChild(g1);
  const g2=mk("div",{className:"form-group"}); g2.append(mk("label",{className:"form-label"},"Cinsiyet"));
  const cinsSel=mk("select",{id:"f-bulk-cinsiyet"});
  [{v:"disi",l:"♀ Dişi"},{v:"erkek",l:"♂ Erkek"}].forEach(({v,l})=>{ const o=mk("option",{value:v},l); if((f.cinsiyet||"disi")===v) o.selected=true; cinsSel.appendChild(o); });
  g2.appendChild(cinsSel); r3.appendChild(g2); wrap.appendChild(r3);

  const r4=mk("div",{className:"form-row-2"});
  const g3=mk("div",{className:"form-group"}); g3.append(mk("label",{className:"form-label"},"Ahır"));
  const ahirSel=mk("select",{id:"f-bulk-ahir"});
  ahirSel.appendChild(mk("option",{value:""},"Seçiniz"));
  S.barns.forEach(b=>{ const o=mk("option",{value:b.id},b.ad); if(f.ahirId===b.id) o.selected=true; ahirSel.appendChild(o); });
  g3.appendChild(ahirSel); r4.appendChild(g3);
  addField(r4,"Doğum Tarihi","date","f-bulk-dogum",f.dogumTarihi||"","");
  wrap.appendChild(r4);

  return wrap;

function getBulkAnimalForm() {
  return {
    adet:        parseInt(el("f-bulk-adet")?.value)||0,
    start:       parseInt(el("f-bulk-start")?.value)||1,
    prefix:      el("f-bulk-prefix")?.value.trim()||"",
    tur:         el("f-bulk-tur")?.value||"koyun",
    irk:         el("f-bulk-irk")?.value||"",
    cinsiyet:    el("f-bulk-cinsiyet")?.value||"disi",
    ahirId:      el("f-bulk-ahir")?.value||"",
    dogumTarihi: el("f-bulk-dogum")?.value||"",
  };
}

function addField(parent,label,type,id,value,placeholder) {
  const g=mk("div",{className:"form-group"});
  g.append(mk("label",{className:"form-label"},label));
  g.appendChild(mk("input",{type,id,value:String(value),placeholder}));
  parent.appendChild(g);
}

function getAnimalForm() {
  return {
    kupe:        el("f-kupe")?.value.trim()||"",
    isim:        el("f-isim")?.value.trim()||"",
    tur:         el("f-tur")?.value||"koyun",
    irk:         el("f-irk")?.value||"",
    cinsiyet:    el("f-cinsiyet")?.value||"disi",
    dogumTarihi: el("f-dogum")?.value||"",
    agirlik:     parseFloat(el("f-agirlik")?.value)||0,
    ahirId:      el("f-ahir")?.value||"",
    anneKupe:    el("f-anne")?.value.trim()||"",
    babaKupe:    el("f-baba")?.value.trim()||"",
    gebe:        el("f-gebe")?.checked||false,
    tahminiDogum:el("f-tahmin")?.value||"",
    not:         el("f-not")?.value.trim()||"",
  };
}
</script>

<script>
// ── SERVICE WORKER — Otomatik Güncelleme ──
const SW_VERSION = "v1.3.0"; // sw.js içindeki VERSION ile aynı tutun (yeni sürümde ikisini de artırın)

// ── PWA KURULUM ALGILAMA ──
let deferredInstallPrompt = null;

// Android Chrome: beforeinstallprompt yakala
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Banner göster (eğer zaten kurulmamışsa)
  if (!isStandalone()) showInstallBanner("android");
});

// APK / Standalone algılama
function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true
    || document.referrer.includes("android-app://");
}

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}

function isAndroid() {
  return /android/i.test(navigator.userAgent);
}

// İlk ziyaret kontrolü
function checkFirstVisit() {
  if (isStandalone()) return; // APK/ana ekrandan açılmış, banner gerekmez
  const key = "ciftlik_install_dismissed";
  if (localStorage.getItem(key)) return; // Daha önce kapatmış
  // iOS için her zaman göster (beforeinstallprompt yok iOS'ta)
  if (isIOS()) { setTimeout(() => showInstallBanner("ios"), 1500); return; }
  // Android için beforeinstallprompt gelirse zaten gösterir
  // Ama gelmezse (Chrome dışı vs) gösterme
}

function showInstallBanner(platform) {
  if (document.getElementById("install-banner")) return;
  const banner = document.createElement("div");
  banner.id = "install-banner";
  banner.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;background:#0a2e1f;color:#fff;border-radius:16px;padding:14px 16px;z-index:9998;box-shadow:0 4px 24px rgba(0,0,0,.35);display:flex;align-items:center;gap:12px;animation:slideUp .3s ease;font-family:sans-serif";

  const icon = document.createElement("div");
  icon.style.cssText = "width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0";
  icon.style.backgroundImage = "url(" + window.LOGO_B64 + ")"; icon.style.backgroundSize = "cover"; icon.style.backgroundPosition = "center"; icon.textContent = "";

  const textDiv = document.createElement("div");
  textDiv.style.flex = "1";
  const title = document.createElement("div");
  title.style.cssText = "font-weight:600;font-size:14px;margin-bottom:3px";
  title.textContent = "Çiftliğim'i Kur";
  const sub = document.createElement("div");
  sub.style.cssText = "font-size:12px;opacity:.75;line-height:1.4";
  sub.textContent = platform === "ios"
    ? "Safari'de 📤 → 'Ana Ekrana Ekle'"
    : "Uygulama gibi kullanmak için ana ekrana ekle";
  textDiv.append(title, sub);

  const btnWrap = document.createElement("div");
  btnWrap.style.cssText = "display:flex;flex-direction:column;gap:6px;flex-shrink:0";

  if (platform === "android" && deferredInstallPrompt) {
    const installBtn = document.createElement("button");
    installBtn.style.cssText = "background:#1D9E75;border:none;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap";
    installBtn.textContent = "Ekle";
    installBtn.addEventListener("click", async () => {
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      dismissInstallBanner();
    });
    btnWrap.appendChild(installBtn);
  }

  const closeBtn = document.createElement("button");
  closeBtn.style.cssText = "background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;white-space:nowrap";
  closeBtn.textContent = platform === "ios" ? "Anladım" : "Kapat";
  closeBtn.addEventListener("click", dismissInstallBanner);
  btnWrap.appendChild(closeBtn);

  banner.append(icon, textDiv, btnWrap);
  document.body.appendChild(banner);
}

function dismissInstallBanner() {
  document.getElementById("install-banner")?.remove();
  localStorage.setItem("ciftlik_install_dismissed", "1");
}

// APK kurulumu tamamlandı sinyali
window.addEventListener("appinstalled", () => {
  dismissInstallBanner();
  console.log("Çiftliğim kuruldu!");
});


// sw.js yalnızca http(s) üzerinden (GitHub Pages) çalışır; Android APK'daki yerel dosyada atlanır.
// (Eski sürüm SW'yi blob: adresinden kaydetmeye çalışıyordu; tarayıcılar buna izin vermediği için hiç çalışmıyordu.)
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    // Sayfa açıkken bekleyen bir güncelleme zaten varsa hemen sor.
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const newSW = reg.installing;
      newSW.addEventListener("statechange", () => {
        if (newSW.state === "installed" && navigator.serviceWorker.controller) showUpdateBanner(newSW);
      });
    });
    // Uygulama uzun süre arka planda kalıp tekrar açıldığında yeni sürümü kontrol et
    // (eskiden sayfayı zorla yeniliyordu; bu da açık formdaki bilgileri siliyordu).
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(()=>{}); });
  }).catch(e => console.warn("Service worker kaydedilemedi:", e));

  // Yalnızca kullanıcı "Güncelle"ye bastıysa yeniden yükle (ilk kurulumdaki devralmada değil).
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (window._updateRequested && !refreshing) { refreshing = true; window.location.reload(); }
  });
}

function showUpdateBanner(newSW) {
  // Remove existing banner if any
  document.getElementById("update-banner")?.remove();

  const banner = document.createElement("div");
  banner.id = "update-banner";
  banner.style.cssText = "position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#1D9E75;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:9999;font-family:sans-serif;font-size:14px;font-weight:500;box-shadow:0 2px 12px rgba(0,0,0,.2)";
  banner.innerHTML = '<span>🌿 Yeni güncelleme mevcut!</span><button onclick="applyUpdate()" style="background:rgba(255,255,255,.25);border:none;color:#fff;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">Güncelle</button>';
  document.body.prepend(banner);
  window._pendingSW = newSW;
}

function applyUpdate() {
  if (window._pendingSW) {
    window._updateRequested = true;
    window._pendingSW.postMessage("skipWaiting");
  }
  document.getElementById("update-banner")?.remove();
}
</script>
